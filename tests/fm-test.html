<!doctype html>
<html><head><meta charset="utf-8"><title>FM test</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>body{background:#111;color:#cfc;font:13px monospace}</style></head>
<body><pre id="out">running...</pre>
<script type="module">
import * as THREE from 'three';
import { FlightModel } from '../src/flightmodel.js';
import { aeroCoeffs } from '../src/f15.js';
import { isa } from '../src/atmosphere.js';
import { R2D, D2R, MS2KT, M2FT, G0 } from '../src/math.js';
const out = [];
const log = (...a) => out.push(a.join(' '));
const sky = { heightAt: () => -5000 };
const flat = { heightAt: () => 0 };
const DT = 1 / 240;

function air(alt, mach, opts = {}) {
  const fm = new FlightModel({ fuelFrac: opts.fuel ?? 0.6 });
  const a = isa(alt).a;
  fm.reset({ pos: new THREE.Vector3(0, alt, 0), heading: 0, speed: mach * a, gear: false, throttle: opts.thr ?? 0.8 });
  return fm;
}
function run(fm, secs, fn, world = sky) {
  const n = Math.round(secs / DT);
  for (let i = 0; i < n; i++) { if (fn) fn(fm, i * DT); fm.step(DT, world); }
}
// 1) 순항 트림: 1g, 스로틀 PI로 속도 유지
function trim(alt, mach) {
  const fm = air(alt, mach);
  const target = mach * isa(alt).a;
  let I = 0;
  run(fm, 40, (f) => {
    const e = target - f.s.V; I += e * DT;
    f.ctl.throttle = Math.min(1, Math.max(0, 0.5 + 0.05 * e + 0.01 * I));
  });
  const s = fm.s;
  log(`TRIM  h=${alt}m M=${mach}: α=${(s.alpha*R2D).toFixed(2)}° de=${(fm.surf.de*R2D).toFixed(2)}° thr=${fm.ctl.throttle.toFixed(2)} T=${(s.thrust/1000).toFixed(1)}kN D=${(s.drag/1000).toFixed(1)}kN nz=${s.nz.toFixed(2)} vs=${s.vs.toFixed(1)} KCAS=${(s.cas*MS2KT).toFixed(0)} L/D=${(s.CL/s.CD).toFixed(1)}`);
}
trim(3000, 0.6); trim(9000, 0.85); trim(12000, 1.5);

// 2) 최대 수평 속도 (A/B, 고도 유지 오토파일럿)
function vmax(alt, secs) {
  const fm = air(alt, 0.9, { thr: 1.0, fuel: 0.5 });
  fm.infiniteFuel = true;
  run(fm, secs, (f) => {
    f.ctl.throttle = 1;
    const err = alt - f.pos.y;
    f.ctl.pitch = Math.max(-0.3, Math.min(0.3, 0.002 * err - 0.02 * f.s.vs));
  });
  log(`VMAX  h=${alt}m: M=${fm.s.M.toFixed(2)} KCAS=${(fm.s.cas*MS2KT).toFixed(0)} TAS=${(fm.s.V*MS2KT).toFixed(0)}kt alt=${fm.pos.y.toFixed(0)}`);
}
vmax(0, 150); vmax(11000, 400); vmax(12500, 400);

// 3) 롤 레이트
{
  const fm = air(5000, 0.7);
  let pmax = 0;
  run(fm, 3, (f, t) => { f.ctl.roll = 1; f.ctl.throttle = 0.8; pmax = Math.max(pmax, f.omega.x); });
  log(`ROLL  5km M0.7 full stick: p_max=${(pmax*R2D).toFixed(0)}°/s`);
}
// 4) 피치 응답: 9G 풀업
for (const [alt, mach] of [[3000, 0.8], [6000, 0.6], [10000, 1.4]]) {
  const fm = air(alt, mach, { thr: 1.0 });
  let tReach = -1, nzMax = 0, aMax = 0;
  run(fm, 4, (f, t) => {
    f.ctl.pitch = 1; f.ctl.throttle = 1;
    if (f.s.nz > nzMax) nzMax = f.s.nz;
    aMax = Math.max(aMax, f.s.alpha);
    if (tReach < 0 && f.s.nz > 0.9 * 9) tReach = t;
  });
  log(`PULL  h=${alt} M=${mach}: nz_max=${nzMax.toFixed(2)} t90%=${tReach.toFixed(2)}s α_max=${(aMax*R2D).toFixed(1)}° 4s후 nz=${fm.s.nz.toFixed(2)} M=${fm.s.M.toFixed(2)}`);
}
// 5) 지속 선회율 (정적 성능 계산): 4572 m (15,000 ft)
{
  const fm = air(4572, 0.8, { fuel: 0.5 });
  fm.updateInertia();
  const W = fm.mass * G0, atm = isa(4572);
  let best = { w: 0 };
  const A = {};
  for (let M = 0.4; M <= 1.3; M += 0.05) {
    const V = M * atm.a, q = 0.5 * atm.rho * V * V;
    // 추력
    const e = fm.engines[0]; e.n = 1; e.abTimer = 1; e.ab = 1;
    const T = 2 * e.update(0, 1, atm, M, true);
    let nzS = 0;
    for (let a = 0; a < 35 * D2R; a += 0.1 * D2R) {
      aeroCoeffs({ alpha: a, beta: 0, M, phat: 0, qhat: 0, rhat: 0, flaps: 0, sb: 0, gear: 0, agl: 9999, stores: 0.0048, t: 0 }, A);
      const D = A.CD * q * fm.data.S, L = A.CL * q * fm.data.S;
      if (D > T * Math.cos(a)) break;
      nzS = (L + T * Math.sin(a)) / W;
    }
    nzS = Math.min(nzS, 9);
    const w = G0 * Math.sqrt(Math.max(0, nzS * nzS - 1)) / V * R2D;
    if (w > best.w) best = { w, M, nzS };
  }
  log(`STR   15kft max AB: ${best.w.toFixed(1)}°/s @ M${best.M.toFixed(2)} (${best.nzS.toFixed(1)}G)  mass=${fm.mass.toFixed(0)}kg`);
}
// 6) 이륙 활주
for (const thr of [1.0, 0.8]) {
  const fm = new FlightModel({ fuelFrac: 1 });
  fm.storesMass = 4 * 85.3 + 4 * 152; fm.storesDrag = 0.0048;
  fm.reset({ pos: new THREE.Vector3(0, 2.08, 0), heading: 0, speed: 0, gear: true, onGround: true, throttle: 0 });
  fm.flapCmd = true; fm.flapPos = 1;
  let x0 = fm.pos.z, liftoff = null, tRot = null, settled = false;
  let nextLog = 0;
  run(fm, 40, (f, t) => {
    if (t < 2) { f.ctl.brake = 1; f.ctl.throttle = 0; return; }
    f.ctl.brake = 0; f.ctl.throttle = thr;
    const kt = f.s.V * MS2KT;
    if (kt > 140 && !liftoff) { f.ctl.pitch = Math.min(1, (12 * D2R - f.s.theta) * 4); if (tRot === null) tRot = t; } else if (liftoff) { f.ctl.pitch = Math.max(-0.3, Math.min(0.3, (0.2 - f.s.theta) * 2)); f.gearCmd = false; } else f.ctl.pitch = 0;
    if (!liftoff && !f.wow && t > 3) liftoff = { d: x0 - f.pos.z, kt, t };
  }, flat);
  log(`TO    thr=${thr} mass=${fm.mass.toFixed(0)}: liftoff ${liftoff ? liftoff.d.toFixed(0) + 'm @' + liftoff.kt.toFixed(0) + 'kt t=' + liftoff.t.toFixed(1) : 'NONE'} crashed=${fm.crashed} ${fm.crashReason} final alt=${fm.pos.y.toFixed(0)} V=${(fm.s.V*MS2KT).toFixed(0)}kt`);
}
// 7) 정지 상태 안정성 (지상)
{
  const fm = new FlightModel({ fuelFrac: 1 });
  fm.reset({ pos: new THREE.Vector3(0, 2.08, 0), heading: 0, speed: 0, gear: true, onGround: true, throttle: 0 });
  run(fm, 10, (f) => { f.ctl.brake = 1; }, flat);
  log(`GND   rest: y=${fm.pos.y.toFixed(3)} pitch=${(fm.s.theta*R2D).toFixed(2)}° v=${fm.vel.length().toFixed(3)} gear=${fm.gearContact.map(c=>c.toFixed(3))} crashed=${fm.crashed}`);
}
// 8) 상승률 (해면, M0.9, A/B)
{
  const fm = air(300, 0.9, { thr: 1, fuel: 0.5 });
  run(fm, 2, (f) => { f.ctl.throttle = 1; });
  log(`PS    SL M0.9 AB: Ps=${fm.s.ps.toFixed(0)} m/s (${(fm.s.ps*196.85).toFixed(0)} fpm) T=${(fm.s.thrust/1000).toFixed(0)}kN`);
}
// 9) CAS 해제 직결 모드 + 스톨/스핀 진입 (안정성 확인)
{
  const fm = air(8000, 0.5, { thr: 0.5 });
  fm.casOn = false;
  let aMax = 0, rMax = 0;
  run(fm, 12, (f, t) => { f.ctl.pitch = t < 8 ? 1 : 0; f.ctl.roll = t > 3 && t < 5 ? 0.6 : 0; f.ctl.throttle = 0.4; aMax = Math.max(aMax, f.s.alpha); rMax = Math.max(rMax, Math.abs(f.omega.z)); });
  log(`DIRECT stall: α_max=${(aMax*R2D).toFixed(1)}° |r|max=${(rMax*R2D).toFixed(0)}°/s final M=${fm.s.M.toFixed(2)} nan=${isNaN(fm.pos.y)}`);
}
// 10) 무입력 안정성 (CAS)
{
  const fm = air(5000, 0.75, { thr: 0.75 });
  run(fm, 3, (f, t) => { f.ctl.roll = t < 1 ? 1 : 0; f.ctl.pitch = t < 0.5 ? 0.5 : 0; });
  run(fm, 10, (f) => {});
  log(`HOLD  after doublet: p=${(fm.omega.x*R2D).toFixed(2)} q=${(fm.omega.y*R2D).toFixed(2)} r=${(fm.omega.z*R2D).toFixed(2)} β=${(fm.s.beta*R2D).toFixed(2)} nz=${fm.s.nz.toFixed(2)} bank=${(fm.s.phi*R2D).toFixed(1)}`);
}
document.getElementById('out').textContent = out.join('\n');
window.__done = out;
</script></body></html>
